# Render.com blueprint — MineGuardAI public deployment.
# Full guide: RENDER_DEPLOY.md. Create the services via
# Render Dashboard -> New -> Blueprint -> pick this repo/branch.
#
# Secrets marked `sync: false` are entered once in the Render dashboard and
# are never stored in this repository. Vyra is the production detector;
# nothing here changes model, taxonomy, database or existing features.
services:
  - type: web
    name: mineguardai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free                 # 512 MB; upgrade to starter if OOMs appear
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1            # one instance: weights are fetched per-container start
    # FREE TIER: no persistent disks. The container filesystem is ephemeral, so
    # docker/entrypoint.sh re-downloads the Vyra weights from WEIGHTS_URL into
    # /data/weights on every deploy/restart (~10-20 s on Render's network).
    # Paid plans can pin them with:
    # disk:
    #   name: mineguard-weights
    #   mountPath: /data
    #   sizeGB: 2
    envVars:
      # --- secrets: set once in the dashboard (never in git) ---
      - key: DATABASE_URL        # Supabase Postgres session-mode 5432 string
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: WEIGHTS_URL         # private link to vyra_yolov8m_ppe.pt
        sync: false
      # --- production detector: Vyra (model + default strategy unchanged).
      #     NOTE: AI_DETECTOR_STRATEGY=person_anchor (Vyra + yolo11n anchor +
      #     ByteTrack, verified locally) OOM-kills the 512MB free instance —
      #     both models cannot stay resident. To enable it, upgrade the
      #     service to Standard (2GB) AND set the strategy back to
      #     person_anchor plus PERSON_ANCHOR_MODEL_PATH=/data/weights/yolo11n.pt
      #     and ANCHOR_WEIGHTS_URL (ultralytics v8.3.0 yolo11n.pt); the
      #     entrypoint already fetches anchor weights when those are set.
      - key: AI_DETECTOR
        value: yolo
      - key: AI_DETECTOR_STRATEGY
        value: default
      - key: YOLO_MODEL_PATH
        value: /data/weights/vyra_yolov8m_ppe.pt
      # --- exact thresholds from the verified local live demo (do not retune) ---
      - key: YOLO_CAPTURE_CONFIDENCE
        value: "0.10"
      - key: PPE_VIOLATION_CONFIDENCE
        value: "0.35"
      # --- 512MB hygiene: thread-pool caps + glibc arena limit keep the
      #     single Vyra model inside the memory ceiling (uploads previously
      #     showed OOM-style 502s without them). Costs some inference latency.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # --- web wiring: exact public frontend origin (see RENDER_DEPLOY.md 3a) ---
      - key: CORS_ORIGINS
        value: https://mineguardai-web.onrender.com,http://localhost:5173
      # --- feature parity with the verified local deployment ---
      - key: STORAGE_PROVIDER
        value: supabase
      - key: AUTH_PROVIDER
        value: local
      - key: DEBUG
        value: "false"

  - type: web
    name: mineguardai-web
    runtime: static
    buildCommand: cd frontend && npm ci --no-fund --no-audit && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Baked in at build time: the browser calls the public API origin.
      - key: VITE_API_BASE_URL
        value: https://mineguardai-api.onrender.com
    routes:
      - type: rewrite            # SPA: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
